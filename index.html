<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A fast phone interval timer. Work, rest, rounds, and a plain countdown. Works offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Interval Timer">
  <meta name="robots" content="noindex">
  <title>Interval Timer</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    html, body { background: #000; color: #fff; margin: 0; height: 100%; }
    #boot-status {
      min-height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
      font-family: Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="app">
    <p id="boot-status">Loading timer…</p>
  </div>
  <script>
    (function () {
      var HEAL_KEY = 'go-timer.sw-heal';

      function heal() {
        var jobs = [];
        if (navigator.serviceWorker) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }));
        }
        if (window.caches) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }));
        }
        return Promise.all(jobs).catch(function () {}).then(function () {
          var next = new URL(location.href);
          next.searchParams.set('fresh', String(Date.now()));
          location.replace(next.href);
        });
      }

      function show(message) {
        if (document.getElementById('boot-error')) return;
        var panel = document.createElement('div');
        panel.id = 'boot-error';
        panel.setAttribute('role', 'alert');
        panel.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;font-family:Roboto,Helvetica,Arial,sans-serif';
        var title = document.createElement('p');
        title.textContent = 'The timer hit a problem and stopped drawing.';
        title.style.cssText = 'font-size:20px;line-height:1.35;margin:0;max-width:320px';
        var detail = document.createElement('p');
        detail.textContent = message || 'Reset removes the stored page and loads a fresh copy.';
        detail.style.cssText = 'color:#aaa;font-size:14px;line-height:1.4;margin:0;max-width:320px';
        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Reset timer';
        button.style.cssText = 'background:#fff;color:#111;border:0;border-radius:999px;padding:14px 22px;font-size:16px;font-weight:700';
        button.addEventListener('click', heal);
        panel.appendChild(title);
        panel.appendChild(detail);
        panel.appendChild(button);
        document.body.appendChild(panel);
      }

      window.__showTimerError = show;
      window.__timerReset = heal;

      window.addEventListener('error', function (event) {
        if (document.querySelector('.go-timer')) return;
        show(event && event.message ? event.message : 'The timer could not load.');
      });

      if (navigator.serviceWorker) {
        navigator.serviceWorker.addEventListener('message', function (event) {
          if (!event.data || event.data.type !== 'RELOAD') return;
          var seen = false;
          try { seen = sessionStorage.getItem(HEAL_KEY) === '13'; } catch (err) {}
          if (seen) return;
          if (document.querySelector('.go-timer')) return;
          try { sessionStorage.setItem(HEAL_KEY, '13'); } catch (err) {}
          location.reload();
        });
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (!reg) return;
          if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          return reg.update();
        }).catch(function () {});
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          setTimeout(function () {
            if (document.querySelector('.go-timer')) return;
            var tried = false;
            try { tried = sessionStorage.getItem(HEAL_KEY) === '1'; } catch (err) {}
            if (tried) return;
            try { sessionStorage.setItem(HEAL_KEY, '1'); } catch (err) {}
            location.reload();
          }, 500);
        });
      }

      setTimeout(function () {
        if (document.querySelector('.go-timer')) return;
        show('The timer did not start.');
        var controlled = navigator.serviceWorker && navigator.serviceWorker.controller;
        var tried = false;
        try { tried = sessionStorage.getItem(HEAL_KEY) === '1'; } catch (err) {}
        if (controlled && !tried) {
          try { sessionStorage.setItem(HEAL_KEY, '1'); } catch (err) {}
          heal();
        }
      }, 3000);
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
  <script>
    (function () {
      var moduleScript = document.querySelector('script[type="module"]');
      var src = moduleScript ? moduleScript.getAttribute('src') || '' : '';
      if (src.indexOf('/assets/') === -1 || !navigator.serviceWorker) return;
      navigator.serviceWorker.register(new URL('sw.js', location.href).href, { updateViaCache: 'none' }).then(function (reg) {
        if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        return reg.update();
      }).catch(function () {});
    })();
  </script>
  <noscript>This timer needs JavaScript. It still runs entirely on your phone — nothing is sent anywhere.</noscript>
</body>
</html>
